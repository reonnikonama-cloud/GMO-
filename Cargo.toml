[package]
name = "crypto_rust_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "crypto_rust_engine"
crate-type = ["cdylib"]
path = "rust_src/lib.rs"  # ← ここを追加！（ソースファイルの場所を明示）

[dependencies]
pyo3 = { version = "0.20.0", features = ["extension-module"] }
tokio = { version = "1.37.0", features = ["full"] }
reqwest = { version = "0.12.4", features = ["json"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.117"
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"
chrono = "0.4.38"
